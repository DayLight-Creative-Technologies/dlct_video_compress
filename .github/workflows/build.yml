name: Build the package

# [DLCT] A push to master starts a run (verified 2026-10-03: the dlct.3 push
# started run 37154891594, unlike dlct_background_downloader, SSK gap #859).
# Watch that run. Dispatching another on the same ref cancels it through the
# concurrency group below; dispatch only when no push run exists:
#   gh workflow run build.yml --repo DayLight-Creative-Technologies/dlct_video_compress --ref master
# SSK refuses a pin of this fork unless the pinned commit has a successful run
# of this workflow; the gate requires jobs by name, so renaming a job breaks
# that gate on purpose.
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # This is Dart 3.13.0. The floor is Flutter 3.47 (3.1.5+dlct.9): the first
  # release with package:material_ui, which the example uses because 3.47
  # deprecated package:flutter/material.dart. The built-in Kotlin migration
  # (3.1.5+dlct.1) needs 3.44 or later; the example's AGP 9
  # (android.builtInKotlin=false) builds on Gradle 9.3.1, the lowest Gradle
  # Flutter 3.50 accepts.
  FLUTTER_MIN_SDK: '3.47.0'

jobs:
  lint:
    name: "Check linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze --fatal-infos
        working-directory: example

  test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter test
        working-directory: example

  # [DLCT] Kotlin JVM unit tests of the plugin's Android code, run with the
  # example app as the Gradle host. The last step fails if the expected test
  # suite produced no results or ran no tests, so a test source set that
  # Gradle silently skips fails the job instead of passing it.
  native-test-android:
    name: "Native unit tests (Android)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --config-only
        working-directory: example
      - name: Run Kotlin JVM unit tests
        working-directory: example/android
        run: ./gradlew :video_compress:testDebugUnitTest
      - name: Fail if a Kotlin test class did not run
        run: |
          for suite in PendingCompressTest MediaInfoTest MediaInfoJsonTest ExportRangeTest EndTrimDataSourceTest MonotonicAudioDataSinkTest; do
            result="example/build/video_compress/test-results/testDebugUnitTest/TEST-com.example.video_compress.$suite.xml"
            test -f "$result"
            grep -q 'tests="[1-9][0-9]*"' "$result"
            echo "$suite: $(grep -h -o 'tests="[0-9]*"' "$result")"
          done

  # [DLCT] The real plugin on Android emulators: the instrumentation tests in
  # example/android/app/src/androidTest call the plugin's channel handler on
  # the device (getMediaInfo on the turned and mirrored fixtures, thumbnails,
  # SSK's compress, trims, and cancels), against Android's own
  # MediaMetadataRetriever, MediaCodec and Transcoder. They run on Android 16
  # (API 36), all of them, and on API 24, the lowest any app on the Flutter
  # floor runs on (Flutter 3.44's minSdk, and SSK's; the plugin declares 21),
  # all but the ones that need a video encoder. After each run the job fails
  # unless the test class reported every @Test it should have, with no
  # failure, error or skip.
  native-integration-test-android:
    name: "Native integration tests (Android)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --config-only
        working-directory: example
      - name: Build the app and its instrumentation tests
        working-directory: example/android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run on Android 16 (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: example/android
          # On a failure, the plugin's and Transcoder's log lines show why.
          script: ./gradlew :app:connectedDebugAndroidTest || (adb logcat -d | grep -E "TranscodeEngine|VideoCompress|MPEG4Writer|ACodec|DEBUG|Fatal" | tail -300; exit 1)
      - name: Fail unless every test ran and passed on API 36
        run: native_tests/android/check_instrumentation_results.sh api36
      # The tests marked @RequiresVideoEncoder are left out here: this
      # emulator's software H.264 encoder crashes the media server
      # (example/android/app/src/androidTest/.../RequiresVideoEncoder.kt).
      - name: Run on Android 7.0 (API 24)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: example/android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notAnnotation=com.example.video_compress_example.RequiresVideoEncoder || (adb logcat -d | grep -E "TranscodeEngine|VideoCompress|MPEG4Writer|ACodec|DEBUG|Fatal" | tail -300; exit 1)
      - name: Fail unless every other test ran and passed on API 24
        run: native_tests/android/check_instrumentation_results.sh api24 --without-video-encoder

  # [DLCT] The macOS plugin's real sources (macos/Classes), compiled against a
  # FlutterMacOS stand-in, answer getMediaInfo, getByteThumbnail and
  # getFileThumbnail on fixture files (native_tests/media_info) and compress
  # the turned and mirrored ones for real, on each of its API paths. The
  # script exits non-zero on any failed check, and when no check ran.
  native-test-macos:
    name: "Native unit tests (macOS)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the plugin's macOS logic
        run: native_tests/media_info/run_macos.sh

  # [DLCT] The same checks, real compresses included, on the iOS plugin's
  # real Swift sources (ios/video_compress/Sources/video_compress), compiled against a Flutter stand-in and
  # run inside
  # simulators of the newest and the oldest iOS runtime the runner has. The
  # script exits non-zero on any failed check, when a run reports no passed
  # checks, and when no runtime is installed.
  native-test-ios:
    name: "Native unit tests (iOS)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the plugin's iOS logic on simulators
        run: native_tests/media_info/run_ios.sh

  build-android:
    name: "Build Android (${{ matrix.sdk }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [ min, stable ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ matrix.sdk == 'min' && env.FLUTTER_MIN_SDK || '' }}
          channel: stable
      - run: flutter --version
      - run: flutter pub get
        working-directory: example
      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

  build-ios:
    name: "Build iOS (${{ matrix.sdk }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [ min, stable ]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ matrix.sdk == 'min' && env.FLUTTER_MIN_SDK || '' }}
          channel: stable
      - run: flutter --version
      # [DLCT] CocoaPods, explicitly: SSK builds this plugin from
      # ios/video_compress.podspec until its SwiftPM cutover. The job below
      # builds it through the Swift package.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
        working-directory: example
      - name: Build example iOS app
        working-directory: example
        run: flutter build ios --no-codesign --simulator --debug

  # [DLCT] The plugin's Swift package (ios/video_compress/Package.swift) built
  # by Swift Package Manager in the example app. A plugin whose manifest
  # Flutter cannot use falls back to CocoaPods silently, so the last step
  # fails unless Flutter's generated plugin package links video_compress
  # through its Swift package. SSK refuses a pin of this fork unless this job
  # succeeded on the pinned commit; renaming it breaks that gate on purpose.
  swiftpm-build-ios:
    name: "SwiftPM build (iOS)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: stable
      - run: flutter --version
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
        working-directory: example
      - name: Build example iOS app with Swift Package Manager
        working-directory: example
        run: flutter build ios --no-codesign --simulator --debug
      - name: Fail unless video_compress linked through its Swift package
        working-directory: example
        run: |
          grep -F '.product(name: "video-compress", package: "video_compress")' ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift

  build-macos:
    name: "Build macOS (${{ matrix.sdk }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [ min, stable ]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ matrix.sdk == 'min' && env.FLUTTER_MIN_SDK || '' }}
          channel: stable
      - run: flutter --version
      - run: flutter pub get
        working-directory: example
      - name: Build example macOS app
        working-directory: example
        run: flutter build macos --debug
