name: Build the package

# [DLCT] A push to master starts a run (verified 2026-10-03: the dlct.3 push
# started run 37154891594, unlike dlct_background_downloader, SSK gap #859).
# Watch that run. Dispatching another on the same ref cancels it through the
# concurrency group below; dispatch only when no push run exists:
#   gh workflow run build.yml --repo DayLight-Creative-Technologies/dlct_video_compress --ref master
# SSK refuses a pin of this fork unless the pinned commit has a successful run
# of this workflow; the gate requires jobs by name, so renaming a job breaks
# that gate on purpose.
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # This is Dart 3.12.0. The floor is Flutter 3.44: android/build.gradle no
  # longer applies kotlin-android and declares a top-level
  # `kotlin { compilerOptions {} }` block (built-in Kotlin migration,
  # 3.1.5+dlct.1). Flutter's Gradle plugin applies KGP to plugin modules
  # itself only from 3.44 on, and 3.44 is the first release that builds the
  # example's AGP 9 (android.builtInKotlin=false) on Gradle 9.1.
  FLUTTER_MIN_SDK: '3.44.0'

jobs:
  lint:
    name: "Check linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze --fatal-infos
        working-directory: example

  test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter test
        working-directory: example

  # [DLCT] Kotlin JVM unit tests of the plugin's Android code, run with the
  # example app as the Gradle host. The last step fails if the expected test
  # suite produced no results or ran no tests, so a test source set that
  # Gradle silently skips fails the job instead of passing it.
  native-test-android:
    name: "Native unit tests (Android)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --config-only
        working-directory: example
      - name: Run Kotlin JVM unit tests
        working-directory: example/android
        run: ./gradlew :video_compress:testDebugUnitTest
      - name: Fail if a Kotlin test class did not run
        run: |
          for suite in PendingCompressTest MediaInfoTest MediaInfoJsonTest; do
            result="example/build/video_compress/test-results/testDebugUnitTest/TEST-com.example.video_compress.$suite.xml"
            test -f "$result"
            grep -q 'tests="[1-9][0-9]*"' "$result"
            echo "$suite: $(grep -h -o 'tests="[0-9]*"' "$result")"
          done

  # [DLCT] The macOS plugin's real sources (macos/Classes), compiled against a
  # FlutterMacOS stand-in, answer getMediaInfo, getByteThumbnail and
  # getFileThumbnail on fixture files (native_tests/media_info), on both of
  # its loading paths. The script exits non-zero on any failed check, and
  # when no check ran.
  native-test-macos:
    name: "Native unit tests (macOS)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the plugin's macOS logic
        run: native_tests/media_info/run_macos.sh

  # [DLCT] The same checks on the iOS plugin's real Swift sources
  # (ios/Classes), compiled against a Flutter stand-in and run inside
  # simulators of the newest and the oldest iOS runtime the runner has. The
  # script exits non-zero on any failed check, when a run reports no passed
  # checks, and when no runtime is installed.
  native-test-ios:
    name: "Native unit tests (iOS)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the plugin's iOS logic on simulators
        run: native_tests/media_info/run_ios.sh

  build-android:
    name: "Build Android (${{ matrix.sdk }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [ min, stable ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ matrix.sdk == 'min' && env.FLUTTER_MIN_SDK || '' }}
          channel: stable
      - run: flutter --version
      - run: flutter pub get
        working-directory: example
      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

  build-ios:
    name: "Build iOS (${{ matrix.sdk }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [ min, stable ]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ matrix.sdk == 'min' && env.FLUTTER_MIN_SDK || '' }}
          channel: stable
      - run: flutter --version
      - run: flutter pub get
        working-directory: example
      - name: Build example iOS app
        working-directory: example
        run: flutter build ios --no-codesign --simulator --debug

  build-macos:
    name: "Build macOS (${{ matrix.sdk }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [ min, stable ]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ matrix.sdk == 'min' && env.FLUTTER_MIN_SDK || '' }}
          channel: stable
      - run: flutter --version
      - run: flutter pub get
        working-directory: example
      - name: Build example macOS app
        working-directory: example
        run: flutter build macos --debug
